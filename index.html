<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadowfax Token Usage</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1a2e;
            color: #eee;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: #7c3aed;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .last-updated {
            color: #999;
            font-size: 0.9rem;
            margin-top: -20px;
            margin-bottom: 30px;
        }

        .kpi-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .kpi-card {
            background: #16213e;
            padding: 25px;
            border-radius: 12px;
            border-left: 4px solid #7c3aed;
        }

        .kpi-card h3 {
            color: #999;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kpi-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #7c3aed;
        }

        .kpi-card .value.secondary {
            color: #eee;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .chart-container {
            background: #16213e;
            padding: 30px;
            border-radius: 12px;
        }

        .chart-container h2 {
            color: #eee;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
        }

        .table-container {
            background: #16213e;
            padding: 30px;
            border-radius: 12px;
            overflow-x: auto;
        }

        .table-container h2 {
            color: #eee;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1a1a2e;
            padding: 15px;
            text-align: left;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #1a1a2e;
            color: #eee;
        }

        tr:hover {
            background: #1a1a2e;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge.kimi { background: #3b82f6; color: #fff; }
        .badge.sonnet { background: #10b981; color: #fff; }
        .badge.opus { background: #f59e0b; color: #fff; }
        .badge.haiku { background: #ec4899; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shadowfax Token Usage</h1>
        <div class="last-updated" id="lastUpdated">Loading...</div>

        <div class="kpi-cards">
            <div class="kpi-card">
                <h3>Today's Est. Cost</h3>
                <div class="value" id="todayCost">$0.00</div>
            </div>
            <div class="kpi-card">
                <h3>MTD Est. Cost</h3>
                <div class="value" id="mtdCost">$0.00</div>
            </div>
            <div class="kpi-card">
                <h3>HF Balance</h3>
                <div class="value secondary" id="hfBalance">-</div>
            </div>
            <div class="kpi-card">
                <h3>Active Models</h3>
                <div class="value secondary" id="activeModels">0</div>
            </div>
        </div>

        <div class="charts">
            <div class="chart-container">
                <h2>Daily Estimated Cost (USD) - Last 30 Days</h2>
                <div class="chart-wrapper">
                    <canvas id="costChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <h2>Daily Token Volume (Estimated) - Last 30 Days</h2>
                <div class="chart-wrapper">
                    <canvas id="tokenChart"></canvas>
                </div>
            </div>
        </div>

        <div class="table-container">
            <h2>Last 7 Days Breakdown</h2>
            <table id="breakdownTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Kimi Runs</th>
                        <th>Sonnet Runs</th>
                        <th>Opus Runs</th>
                        <th>Haiku Runs</th>
                        <th>Est. Cost</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" style="text-align: center; color: #999;">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let costChart = null;
        let tokenChart = null;

        const MODEL_COLORS = {
            kimi: '#3b82f6',
            sonnet: '#10b981',
            opus: '#f59e0b',
            haiku: '#ec4899'
        };

        async function fetchData() {
            try {
                const response = await fetch('./usage-data.json');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching data:', error);
                return null;
            }
        }

        function updateKPIs(data) {
            const today = new Date().toISOString().split('T')[0];
            const currentMonth = today.substring(0, 7); // YYYY-MM

            let todayCost = 0;
            let mtdCost = 0;
            const activeModelsSet = new Set();

            data.days.forEach(day => {
                const dayCost = day.total_est_cost_usd || 0;

                if (day.date === today) {
                    todayCost = dayCost;
                }

                if (day.date.startsWith(currentMonth)) {
                    mtdCost += dayCost;
                }

                Object.keys(day.models).forEach(model => {
                    if (day.models[model].runs > 0) {
                        activeModelsSet.add(model);
                    }
                });
            });

            document.getElementById('todayCost').textContent = '$' + todayCost.toFixed(2);
            document.getElementById('mtdCost').textContent = '$' + mtdCost.toFixed(2);
            document.getElementById('hfBalance').textContent = data.hf_balance !== null ? '$' + (data.hf_balance || 0).toFixed(2) : 'N/A';
            document.getElementById('activeModels').textContent = activeModelsSet.size;

            const updatedAt = new Date(data.updated_at);
            document.getElementById('lastUpdated').textContent = 'Last updated: ' + updatedAt.toLocaleString();
        }

        function createCostChart(data) {
            const ctx = document.getElementById('costChart');

            // Prepare datasets by model
            const modelData = {};
            const labels = data.days.map(d => d.date);

            data.days.forEach(day => {
                Object.keys(day.models).forEach(model => {
                    if (!modelData[model]) {
                        modelData[model] = new Array(data.days.length).fill(0);
                    }
                });
            });

            data.days.forEach((day, idx) => {
                Object.keys(day.models).forEach(model => {
                    modelData[model][idx] = day.models[model].est_cost_usd || 0;
                });
            });

            const datasets = Object.keys(modelData).map(model => ({
                label: model.charAt(0).toUpperCase() + model.slice(1),
                data: modelData[model],
                borderColor: MODEL_COLORS[model] || '#666',
                backgroundColor: MODEL_COLORS[model] || '#666',
                tension: 0.3,
                fill: false
            }));

            if (costChart) {
                costChart.destroy();
            }

            costChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#eee' }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#999' },
                            grid: { color: '#2a2a3e' }
                        },
                        y: {
                            ticks: { color: '#999' },
                            grid: { color: '#2a2a3e' },
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function createTokenChart(data) {
            const ctx = document.getElementById('tokenChart');

            const modelData = {};
            const labels = data.days.map(d => d.date);

            data.days.forEach(day => {
                Object.keys(day.models).forEach(model => {
                    if (!modelData[model]) {
                        modelData[model] = new Array(data.days.length).fill(0);
                    }
                });
            });

            data.days.forEach((day, idx) => {
                Object.keys(day.models).forEach(model => {
                    modelData[model][idx] = (day.models[model].est_tokens || 0) / 1000; // Convert to K
                });
            });

            const datasets = Object.keys(modelData).map(model => ({
                label: model.charAt(0).toUpperCase() + model.slice(1),
                data: modelData[model],
                backgroundColor: MODEL_COLORS[model] || '#666'
            }));

            if (tokenChart) {
                tokenChart.destroy();
            }

            tokenChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#eee' }
                        }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            ticks: { color: '#999' },
                            grid: { color: '#2a2a3e' }
                        },
                        y: {
                            stacked: true,
                            ticks: { color: '#999' },
                            grid: { color: '#2a2a3e' },
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Tokens (K)',
                                color: '#999'
                            }
                        }
                    }
                }
            });
        }

        function updateTable(data) {
            const tbody = document.querySelector('#breakdownTable tbody');
            const last7Days = data.days.slice(-7);

            tbody.innerHTML = '';

            last7Days.forEach(day => {
                const row = document.createElement('tr');

                const kimiRuns = day.models.kimi?.runs || 0;
                const sonnetRuns = day.models.sonnet?.runs || 0;
                const opusRuns = day.models.opus?.runs || 0;
                const haikuRuns = day.models.haiku?.runs || 0;

                row.innerHTML = `
                    <td>${day.date}</td>
                    <td>${kimiRuns}</td>
                    <td>${sonnetRuns}</td>
                    <td>${opusRuns}</td>
                    <td>${haikuRuns}</td>
                    <td>$${day.total_est_cost_usd.toFixed(4)}</td>
                `;

                tbody.appendChild(row);
            });
        }

        async function refresh() {
            const data = await fetchData();
            if (data) {
                updateKPIs(data);
                createCostChart(data);
                createTokenChart(data);
                updateTable(data);
            }
        }

        // Initial load
        refresh();

        // Auto-refresh every 5 minutes
        setInterval(refresh, 5 * 60 * 1000);
    </script>
</body>
</html>
